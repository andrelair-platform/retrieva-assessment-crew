[project]
name = "retrieva-assessment-crew"
version = "0.1.0"
description = "CrewAI DORA ICT third-party assessment crew, exposed over A2A to Retrieva's deterministic supervisor"
readme = "README.md"
authors = [
    { name = "AndreLiar", email = "andrelaurelyvan.kanmegnetabouguie@ynov.com" }
]
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk[http-server]~=0.3.10",
    "crewai[a2a]>=1.15.28",
    "jsonschema>=4.26.0",
    "langfuse>=5.0.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
retrieva-assessment-crew = "retrieva_assessment_crew:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE"]

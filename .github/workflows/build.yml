# =============================================================================
# Build & Push — minicloud org standard (retrieva-assessment-crew, single image)
# Builds the crew image and pushes to Harbor (dev registry) + ghcr-org (durable prod
# registry); signs + SBOMs on main. Deployment is GitOps (ArgoCD) in minicloud-gitops;
# Kargo promotes dev->prod off the ghcr image (git-Warehouse — Python image, RTV-80b).
# The minicloud CA is baked in (ARG CA_CERT) so the crew trusts internal TLS (LiteLLM/Langfuse).
# Org secrets (public repo inherits): TS_OAUTH_*, MINICLOUD_CA_CERT, HARBOR_USER/PASSWORD.
# =============================================================================
name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

env:
  GHCR_ORG: ghcr.io/andrelair-platform
  IMAGE: retrieva-assessment-crew

jobs:
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true

      - uses: actions/checkout@v5

      - name: Compute metadata
        id: meta
        run: |
          SHA=$(git rev-parse --short HEAD)
          echo "tag=${SHA}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "branch=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Login to ghcr (org)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Compose image tags
        id: tags
        run: |
          GHCR_REF="${{ env.GHCR_ORG }}/${{ env.IMAGE }}:${{ steps.meta.outputs.sha }}"
          echo "ghcr=${GHCR_REF}" >> "$GITHUB_OUTPUT"
          { echo 'list<<EOF'; echo "${GHCR_REF}"; echo 'EOF'; } >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            CA_CERT=${{ secrets.MINICLOUD_CA_CERT }}
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        if: steps.meta.outputs.branch == 'main'
        uses: sigstore/cosign-installer@v3

      - name: Sign ghcr image (keyless)
        if: steps.meta.outputs.branch == 'main'
        run: cosign sign --yes ${{ steps.tags.outputs.ghcr }}@${{ steps.build.outputs.digest }}

      - name: Install syft
        if: steps.meta.outputs.branch == 'main'
        uses: anchore/sbom-action/download-syft@v0

      - name: SBOM + attach
        if: steps.meta.outputs.branch == 'main'
        run: |
          syft ${{ steps.tags.outputs.ghcr }}@${{ steps.build.outputs.digest }} -o cyclonedx-json=sbom.json
          cosign attach sbom --sbom sbom.json --type cyclonedx ${{ steps.tags.outputs.ghcr }}@${{ steps.build.outputs.digest }}

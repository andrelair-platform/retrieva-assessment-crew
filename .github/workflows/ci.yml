name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-test:
    name: Lint + Tests (L0/L1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
          enable-cache: true
      - run: uv sync --frozen
      - name: Ruff lint (L0)
        run: uv run ruff check .
      - name: Ruff format check (L0)
        run: uv run ruff format --check .
      - name: Pytest (L1)
        run: uv run pytest -q

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v5
      - name: Build image (no push)
        run: docker build -t retrieva-assessment-crew:ci .

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [lint-test, docker-build]
    steps:
      - run: echo "All CI checks passed."
